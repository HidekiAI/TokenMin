[package]
name = "token-min"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
once_cell = "1.21.3"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.22.0", features = ["v4"] }

[dev-dependencies]
mockito = "1.7.2"
